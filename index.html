<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Card Smartass">
  <title>Credit Card Smartass</title>
  <link rel="manifest" href="manifest.json">
  <style>
    :root {
      --bg: #f0f2f5;
      --surface: #ffffff;
      --primary: #0f172a;
      --accent: #3b82f6;
      --text: #1e293b;
      --muted: #64748b;
      --border: #e2e8f0;
      --winner-bg: #fffbeb;
      --radius: 12px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: env(safe-area-inset-bottom, 20px);
    }

    header {
      background: var(--primary);
      color: white;
      padding: 16px 20px;
      padding-top: calc(16px + env(safe-area-inset-top, 0px));
      text-align: center;
    }

    header h1 {
      font-size: 1.25rem;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    header p {
      font-size: 0.8rem;
      opacity: 0.55;
      margin-top: 3px;
    }

    main {
      max-width: 600px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    .input-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 0.72rem;
      font-weight: 700;
      color: var(--muted);
      text-transform: uppercase;
      letter-spacing: 0.07em;
      margin-bottom: 8px;
    }

    input[type="text"],
    input[type="number"] {
      width: 100%;
      font-size: 1rem;
      font-family: inherit;
      border: 1.5px solid var(--border);
      border-radius: 8px;
      padding: 12px 14px;
      outline: none;
      color: var(--text);
      background: white;
      -webkit-appearance: none;
      transition: border-color 0.15s;
    }

    input[type="text"]:focus,
    input[type="number"]:focus {
      border-color: var(--accent);
    }

    input::placeholder { color: #cbd5e1; }

    .amount-row {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 10px;
    }

    .dollar-sign {
      font-size: 1rem;
      font-weight: 600;
      color: var(--muted);
    }

    #amount { flex: 1; }

    button {
      display: block;
      width: 100%;
      margin-top: 14px;
      background: var(--primary);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 14px;
      font-size: 1rem;
      font-family: inherit;
      font-weight: 600;
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: opacity 0.15s;
    }

    button:active { opacity: 0.75; }

    /* Results */
    #results { display: flex; flex-direction: column; gap: 12px; }

    .hint {
      text-align: center;
      color: var(--muted);
      font-size: 0.9rem;
      padding: 48px 0;
    }

    .card-result {
      background: var(--surface);
      border-radius: var(--radius);
      border-left: 5px solid #ccc;
      padding: 16px;
      box-shadow: 0 1px 4px rgba(0,0,0,0.07);
    }

    .card-result.winner {
      background: var(--winner-bg);
    }

    .rank-label {
      font-size: 0.68rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.09em;
      margin-bottom: 4px;
    }

    .card-name {
      font-size: 1rem;
      font-weight: 700;
      margin-bottom: 10px;
    }

    .value-row {
      display: flex;
      align-items: baseline;
      gap: 6px;
      margin-bottom: 6px;
    }

    .value-main {
      font-size: 1.7rem;
      font-weight: 800;
      line-height: 1;
    }

    .value-label {
      font-size: 0.82rem;
      color: var(--muted);
    }

    .rate-detail {
      font-size: 0.8rem;
      color: var(--muted);
    }

    .rate-detail strong {
      color: var(--text);
      font-weight: 600;
    }

    .portal-tip {
      margin-top: 9px;
      font-size: 0.76rem;
      background: #eff6ff;
      color: #1e40af;
      border-radius: 6px;
      padding: 6px 10px;
    }

    .insight {
      margin-top: 9px;
      font-size: 0.76rem;
      background: #f0fdf4;
      color: #166534;
      border-radius: 6px;
      padding: 6px 10px;
    }

    .error-msg {
      text-align: center;
      color: #dc2626;
      font-size: 0.88rem;
      padding: 16px 0;
    }
  </style>
</head>
<body>

<header>
  <h1>Credit Card Smartass</h1>
  <p>Maximize rewards on every purchase</p>
</header>

<main>
  <div class="input-card">
    <label for="transaction">What are you buying?</label>
    <input
      type="text"
      id="transaction"
      placeholder="e.g. grocery shopping at Supremo"
      autocomplete="off"
      autocorrect="off"
      spellcheck="false"
    >
    <div class="amount-row">
      <span class="dollar-sign">$</span>
      <input
        type="number"
        id="amount"
        placeholder="Amount (optional)"
        inputmode="decimal"
        min="0"
        step="0.01"
      >
    </div>
    <button id="submit">Find Best Card →</button>
  </div>

  <div id="results">
    <p class="hint">Describe a purchase above to see which card wins.</p>
  </div>
</main>

<script src="app.js"></script>
</body>
</html>
